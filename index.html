========================================================================
 نسخة المزامنة السحابية + حسابات — متابعة حفظ القرآن الكريم (مسجد الأخوة)
========================================================================
 هذه نسخة معدّة لاستضافتها بنفسك (Netlify / GitHub Pages / Cloudflare
 Pages) مع مزامنة لحظية، وثلاثة أنواع دخول: مشرف، معلّم، وليّ أمر.

 لا يوجد بريد إلكتروني أو كلمة مرور لأحد. دخول المعلّم والمشرف هو رقم
 الجوال + رقم سري يضعه المشرف عند تسجيل المعلّم (ويقدر المعلّم تغييره
 لاحقًا من حسابه). دخول ولي الأمر هو رقم الجوال فقط. كلاهما بلا رمز
 تحقق SMS — وسيلة تعريف وليست تحققًا أمنيًا حقيقيًا، اختيار مقصود لتفادي
 تكلفة رسائل SMS المدفوعة. مع ذلك، الرقم السري نفسه لا يُخزَّن أبدًا في
 مكان يقدر أي متصفح قراءته — التحقق منه يتم داخل قواعد قاعدة البيانات
 فقط (راجع تعليق "لماذا هذا آمن" أسفل قواعد الأمان).

 خطوات التفعيل (مرة واحدة فقط):

 1) أنشئ مشروعًا مجانيًا على https://console.firebase.google.com
    (حساب Google عادي، بلا بطاقة دفع).

 2) من Build > Firestore Database > Create database (أي موقع قريب،
    "Start in production mode").

 3) من Build > Authentication > Sign-in method: فعّل مزود "Anonymous"
    فقط (هذا يكفي لكل الأدوار الثلاثة).

 4) من Firestore Database > Data، أنشئ نفسك كأول مشرف يدويًا بإضافة
    Collection باسم teachers وبداخلها Document واحد، معرّفه (Document
    ID) هو رقم جوالك بالأرقام فقط بلا رموز أو مسافات (مثال: 79123456):
      الحقول: name (نص، اسمك) — isAdmin (Boolean = true) —
      addedAt (Number = 0)
    ثم أنشئ Collection ثانية باسم teacher_pins، وبداخلها Document
    بنفس معرّف رقم جوالك بالضبط، وحقل واحد: pin (نص، رقمك السري
    الذي ستدخل به، مثال: "1234").

 5) من Firestore Database > Rules، استبدل القواعد بهذا النص ثم Publish:

      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          function myUid() { return request.auth != null ? request.auth.uid : ''; }
          function sessionPhone() {
            return exists(/databases/$(database)/documents/authorized_sessions/$(myUid()))
              ? get(/databases/$(database)/documents/authorized_sessions/$(myUid())).data.phone : '';
          }
          function isLoggedInTeacher() {
            return myUid() != '' && sessionPhone() != '' &&
              exists(/databases/$(database)/documents/teachers/$(sessionPhone()));
          }
          function isAdmin() {
            return isLoggedInTeacher() &&
              get(/databases/$(database)/documents/teachers/$(sessionPhone())).data.isAdmin == true;
          }
          match /app/state {
            allow read: if request.auth != null;
            allow write: if isLoggedInTeacher();
          }
          match /teachers/{phone} {
            allow read: if request.auth != null;
            allow create, delete: if isAdmin();
            allow update: if isAdmin();
          }
          match /teacher_pins/{phone} {
            allow read: if false;
            allow create: if isAdmin();
            allow update: if isAdmin() || (isLoggedInTeacher() && sessionPhone() == phone);
            allow delete: if isAdmin();
          }
          match /authorized_sessions/{uid} {
            allow read, delete: if request.auth != null && request.auth.uid == uid;
            allow create: if request.auth != null && request.auth.uid == uid
              && exists(/databases/$(database)/documents/teachers/$(request.resource.data.phone))
              && get(/databases/$(database)/documents/teacher_pins/$(request.resource.data.phone)).data.pin == request.resource.data.enteredPin;
          }
        }
      }

    لماذا هذا آمن: "teacher_pins" ممنوع قراءته تمامًا (allow read: if
    false) من أي متصفح مهما كانت صلاحيته. "تسجيل الدخول" هو عملية
    كتابة إلى authorized_sessions تقارن الرقم المُدخَل بالرقم السري
    الحقيقي داخل القاعدة نفسها (get) دون أن يغادر الرقم السري القاعدة
    مطلقًا؛ فإن تطابقا نجحت الكتابة (= دخول ناجح)، وإلا رُفضت (= رقم
    خاطئ)، والمتصفح لا يرى الفرق سوى بنجاح الطلب أو فشله.

 6) من ⚙️ Project settings > عام > "Your apps" > أضف تطبيق ويب (</>) 
    وانسخ الإعدادات (firebaseConfig) وألصقها مكان FB_CONFIG أدناه في هذا
    الملف (ابحث عن FB_CONFIG في وسم <script>).

 7) ارفع هذا الملف إلى Netlify (اسحبه إلى app.netlify.com/drop) أو
    GitHub Pages أو Cloudflare Pages، واحصل على رابط دائم لمشاركته.

 8) افتح الرابط، اختر "دخول المعلمين"، وسجّل برقم جوالك ورقمك السري من
    الخطوة 4. من هناك، زر "إدارة المعلمين" أعلى الصفحة يضيف بقية
    المعلمين مباشرة من داخل البرنامج (رقم جوال + رقم سري مبدئي لكل
    منهم) — لا حاجة للرجوع لوحدة تحكم Firebase مرة أخرى. وكل معلّم
    يقدر تغيير رقمه السري بنفسه من زر "تغيير الرقم السري".

 ملاحظة: كل بيانات الطلاب والتسميع مخزّنة في مستند واحد، وهذا يكفي
 بسهولة لآلاف جلسات التسميع.
========================================================================
-->

<style>
:root{
  --paper:#F2F5F1; --card:#FFFFFF; --ink:#16241F; --muted:#57675F; --line:#D6DED8;
  --green:#1D5C4A; --green-ink:#FFFFFF; --mint:#DCEADF; --band:#123D31; --band-ink:#F2F5F1;
  --gold:#B78A2E; --gold-ink:#7A5A12; --warn:#A5402D; --warn-bg:#F7E3DD;
  --font-ui:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;
  --font-q:'Amiri','Traditional Arabic','Scheherazade New',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1814; --card:#14221D; --ink:#E6EEE9; --muted:#9CAEA5; --line:#26382F;
    --green:#5DB791; --green-ink:#0B1712; --mint:#1C3128; --band:#0A2A20; --band-ink:#E6EEE9;
    --gold:#D9AE55; --gold-ink:#E2BE73; --warn:#E88D7A; --warn-bg:#3A211C;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1814; --card:#14221D; --ink:#E6EEE9; --muted:#9CAEA5; --line:#26382F;
  --green:#5DB791; --green-ink:#0B1712; --mint:#1C3128; --band:#0A2A20; --band-ink:#E6EEE9;
  --gold:#D9AE55; --gold-ink:#E2BE73; --warn:#E88D7A; --warn-bg:#3A211C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.connbadge{max-width:920px;margin:0 auto;padding:7px 16px;font-size:.85rem;text-align:center;background:var(--mint);color:var(--ink);border-bottom:1px solid var(--line)}

.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.login-card h1{font-family:var(--font-q);font-size:1.7rem;margin-bottom:6px}
.login-card .field{text-align:right}
.login-card form .actions{flex-direction:column}
.login-card form .actions .btn{width:100%}
.acctbar{max-width:920px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:flex-end;font-size:.88rem;background:var(--card);border-bottom:1px solid var(--line)}

.brandimg{height:64px;width:auto;display:block}
.brandimg-lg{height:96px;width:auto;display:block;margin:0 auto 12px}
/* الشريط العلوي */
.band{background:var(--band);color:var(--band-ink);padding:22px 16px 20px}
.band-in{max-width:920px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.band h1{font-family:var(--font-q);font-size:2.1rem;line-height:1.25;font-weight:700}
.band .sub{font-size:1rem;opacity:.85}
.band .dates{font-size:.9rem;opacity:.8;text-align:end;line-height:1.5}
.tabs-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.tabs{max-width:920px;margin:0 auto;display:flex;padding:0 8px}
.tab{flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 120px}

/* عناصر عامة */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.section{margin-top:22px}
.section>h2{font-family:var(--font-q);font-size:1.4rem;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{min-height:36px;padding:3px 12px;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--green);text-align:start}
.linkbtn:hover{text-decoration:underline}
.chip{display:inline-block;padding:0 10px;border-radius:999px;font-size:.82rem;line-height:1.7;border:1px solid var(--line);background:var(--mint);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.g5,.chip.g4{color:var(--green);border-color:transparent}
.chip.g3{background:transparent}
.chip.g2{background:transparent;color:var(--gold-ink);border-color:var(--gold)}
.chip.g1{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.type{background:transparent}
.bar{height:8px;border-radius:99px;background:var(--mint);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}

/* الإحصاءات */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);padding:14px 16px}
.stat b{display:block;font-family:var(--font-q);font-size:1.75rem;line-height:1.3}
.stat span{font-size:.88rem;color:var(--muted)}

/* قوائم */
.list{list-style:none;margin:0;padding:0}
.late{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.late:last-child{border-bottom:0}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.entry .side{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:.88rem;color:var(--muted)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.hero-empty{text-align:center;padding:30px 18px}
.hero-empty h2{font-family:var(--font-q);font-size:1.6rem;margin-bottom:8px}
.hero-empty p{color:var(--muted);max-width:44ch;margin:0 auto 18px}
.hero-empty .row{justify-content:center}

/* قائمة الطلاب */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar .in{flex:1 1 180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.scard{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.scard:hover{border-color:var(--green)}
.scard .name{font-weight:600;font-size:1.05rem}
.scard .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.scard .meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.88rem;color:var(--muted)}

/* صفحة الطالب */
.back{margin-bottom:12px}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.shead h2{font-family:var(--font-q);font-size:1.9rem;line-height:1.3}

/* خريطة الحفظ */
.juzmap{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (min-width:640px){.juzmap{grid-template-columns:repeat(10,1fr)}}
.juz{position:relative;overflow:hidden;aspect-ratio:1/1.2;border-radius:8px;border:1px solid var(--line);background:var(--mint);cursor:pointer;padding:0}
.juz .jf{position:absolute;inset:auto 0 0 0;height:var(--f);background:var(--green)}
.juz b{position:absolute;inset:4px 0 auto 0;text-align:center;font-family:var(--font-q);font-size:1.2rem;line-height:1.3;font-weight:700}
.juz.full{box-shadow:inset 0 0 0 2px var(--gold)}
.juz.full b{color:var(--green-ink)}
.juz.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px;border:1px solid var(--line)}
.juzinfo{margin-top:12px;min-height:3.2em}

/* النماذج */
.in{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.in:focus{border-color:var(--green)}
textarea.in{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;direction:ltr;text-align:left}
.field{margin:0 0 14px;border:0;padding:0;min-width:0}
.field>label,.field>legend,.lbl{display:block;font-weight:600;margin-bottom:6px;padding:0}
.pair{display:flex;gap:8px;align-items:stretch}
.pair select{flex:2;min-width:0}
.pair input{flex:1;min-width:0}
.seg-group{display:flex;flex-wrap:wrap;gap:8px}
.seg{position:relative}
.seg input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.seg span{display:inline-block;min-height:44px;line-height:26px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.seg input:checked+span{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.hint{min-height:1.6em;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.hint.bad,.err{color:var(--warn)}
.err{min-height:1.4em;margin-bottom:8px;font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}


/* قائمة السور */
.stats.six{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.stats.six{grid-template-columns:repeat(3,1fr)}}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchip{min-height:38px;padding:2px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.slist{padding:4px 14px}
.srow{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;width:100%;min-height:54px;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:hover .sname{color:var(--green)}
.srow .sn{width:30px;height:30px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.srow .sname{font-family:var(--font-q);font-size:1.2rem;line-height:1.4;font-weight:700}
.srow .bar{grid-column:2 / span 2;height:5px}
.srow.complete .sn{background:var(--green);color:var(--green-ink)}
.chip.done{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.checklist{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px 12px;margin-bottom:8px}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.ck input{width:20px;height:20px;margin:0;accent-color:var(--green)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* النوافذ */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,20,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(84px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{font-family:var(--font-q);font-size:1.5rem}
.x{width:44px;height:44px;border-radius:10px;border:0;background:none;font-size:1.6rem;cursor:pointer;line-height:1}

.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--gold);color:#1A1405;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;margin:0 auto;max-width:420px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin-top:28px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n){ return String(n).padStart(2, '0'); }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return dstr(new Date()); }
function dayNum(s){ var p = s.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1]-1, p[2]) / 86400000); }
function daysAgo(s){ return dayNum(today()) - dayNum(s); }
function fmtDate(s){
  try { var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('ar-OM-u-ca-gregory-nu-latn', { weekday: 'short', day: 'numeric', month: 'short' }); }
  catch (e) { return s; }
}
function longToday(){
  try { return new Date().toLocaleDateString('ar-OM-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; }
}
function hijriToday(){
  try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date()); } catch (e) { return ''; }
}
function agoText(n){
  if (n <= 0) return 'اليوم';
  if (n === 1) return 'أمس';
  if (n === 2) return 'منذ يومين';
  if (n <= 10) return 'منذ ' + n + ' أيام';
  return 'منذ ' + n + ' يومًا';
}
function pf(p){ return p === 0 ? '0' : (p < 10 ? p.toFixed(1) : String(Math.round(p))); }
function norm(s){ return String(s).replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim(); }
function checkAyah(s, a){
  if (!(s >= 1 && s <= 114)) return 'اختر السورة';
  if (!(a >= 1 && a <= COUNTS[s-1])) return 'رقم الآية يجب أن يكون بين 1 و ' + COUNTS[s-1] + ' في سورة ' + NAMES[s-1];
  return '';
}
function rangeText(x){
  var n = 'سورة ' + NAMES[x.s-1];
  if (x.from && x.from <= x.a) return x.from === x.a ? n + '، الآية ' + x.a : n + '، من الآية ' + x.from + ' إلى ' + x.a;

function convertSession(x){

  function mk(s, a, from, suffix){

  }

    if (!Number.isInteger(s) || !Number.isInteger(a) || checkAyah(s, a)) return out;
    if (!(Number.isInteger(f) && f >= 1 && f <= a)) f = 0;
    out.push(mk(s, a, f, ''));

function studentStats(id){
  var st = findStudent(id), mem = st.mem || {};
  var memo = 0, done = 0, started = 0, mask = new Uint8Array(TOTAL + 2);
  for (var n = 1; n <= 114; n++) {
    var r = mem[n] || 0;

  }
  var full = 0;

    var c = 0, a = JUZ_ABS[j], b = JUZ_ABS[j+1] - 1;
    for (var m = a; m <= b; m++) c += mask[m];
    if (c === b - a + 1) full++;
  }
  var list = state.sessions.filter(function(x){ return x.studentId === id; })
    .sort(function(a, b){ return b.date.localeCompare(a.date) || b.createdAt - a.createdAt; });
  var sessWeek = 0, weekNew = 0, cur = null;
  list.forEach(function(x){
    var recent = daysAgo(x.date) < 7;
    if (recent) { sessWeek++; if (x.type === 'new' && x.grade > 1 && x.from) weekNew += x.a - x.from + 1; }
    if (!cur && x.type === 'new' && x.grade > 1) cur = { s: x.s, a: mem[x.s] || x.a };
  });
  var last10 = list.slice(0, 10);
  var avg = last10.length ? last10.reduce(function(s, x){ return s + x.grade; }, 0) / last10.length : null;
  return { memo: memo, pct: memo / TOTAL * 100, done: done, started: started, full: full, last: list.length ? list[0].date : null, list: list, avg: avg, weekNew: weekNew, sessWeek: sessWeek, cur: cur };
}

    .sort(function(a, b){ return b.date.localeCompare(a.date) || b.createdAt - a.createdAt; })[0];

function updateRange(f){
  var el = $('#rangeInfo'); if (!el) return;
  var s = +f.elements.s.value, a = parseInt(f.elements.a.value, 10), type = f.elements.type.value;
  if (!a) { el.textContent = ''; el.classList.remove('bad'); return; }

  if (!e) {
    if (type === 'new') { if (a > r) msg = 'آيات جديدة: من الآية ' + (r + 1) + ' إلى ' + a + ' (' + (a - r) + ' آية)'; else msg = 'هذه الآيات محفوظة سابقًا (المحفوظ حتى الآية ' + r + ')، ولن يتغير مستوى الحفظ.'; }

    else msg = 'مراجعة حتى الآية ' + a;
  }
  el.textContent = msg; el.classList.toggle('bad', bad);

function submitSession(f){
  var v = function(n){ return f.elements[n].value; };

  var err = '';
  if (!studentId || !findStudent(studentId)) err = 'اختر الطالب';
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) err = 'أدخل تاريخًا صحيحًا';
  else if (!a) err = 'أدخل رقم الآية التي وصل إليها';
  else err = checkAyah(s, a);
  if (err) { $('#formErr').textContent = err; return; }
  var st = findStudent(studentId); st.mem = st.mem || {};
  var r = st.mem[s] || 0, from = 0;
  if (type === 'new' && grade > 1 && a > r) { from = r + 1; st.mem[s] = a; }
  state.sessions.push({ id: uid(), studentId: studentId, date: date, type: type, s: s, a: a, from: from, grade: grade, note: v('note').trim().slice(0, 200), createdAt: Date.now() });

  } else {

    state.students.push(n);

/* ===== النسخ الاحتياطي ===== */
function csvOut(rows){
  return '\uFEFF' + rows.map(function(r){ return r.map(function(c){
    var t = String(c == null ? '' : c); if (/^[=+\-@]/.test(t)) t = "'" + t;
    return '"' + t.replace(/"/g, '""') + '"';
  }).join(','); }).join('\r\n');
}
function toCsv(){
  var rows = [['التاريخ','الطالب','الحلقة','النوع','السورة','من آية','إلى آية','التقدير','ملاحظة']];
  var by = new Map(state.students.map(function(s){ return [s.id, s]; }));
  state.sessions.slice().sort(function(a, b){ return a.date.localeCompare(b.date); }).forEach(function(x){
    var s = by.get(x.studentId) || {};
    rows.push([x.date, s.name, s.halaqa || '', TYPES[x.type], NAMES[x.s-1], x.from || '', x.a, GRADES[x.grade], x.note || '']);
  });
  return csvOut(rows);
}
function toSummaryCsv(){
  var rows = [['الطالب','الحلقة','آيات محفوظة','النسبة %','سور كاملة','أجزاء مكتملة','وصل إلى','آخر تسميع']];
  state.students.slice().sort(function(a, b){ return a.name.localeCompare(b.name, 'ar'); }).forEach(function(s){
    var t = stat(s.id);
    rows.push([s.name, s.halaqa || '', t.memo, pf(t.pct), t.done, t.full, t.cur ? NAMES[t.cur.s-1] + ' آية ' + t.cur.a : '', t.last || '']);
  });
  return csvOut(rows);
}
function saveFile(filename, data){
  try {
    var blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('تم التنزيل');
  } catch (e) { toast('تعذّر التنزيل'); }
}

/* ===== الأحداث ===== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.dataset.act;
  if (act === 'backdrop') { if (e.target === t) closeModal(); return; }
  if (act === 'close-modal') { closeModal(); return; }
  if (act === 'nav') { ui.view = t.dataset.view; ui.studentId = null; render(); window.scrollTo(0, 0); return; }
  if (act === 'open-student') { ui.view = 'student'; ui.studentId = t.dataset.id; ui.sq = ''; ui.sFilter = 'all'; render(); window.scrollTo(0, 0); return; }
  if (act === 'new-session') { openSessionForm(t.dataset.student || (ui.view === 'student' ? ui.studentId : '')); return; }
  if (act === 'add-student') { openStudentForm(); return; }
  if (act === 'edit-student') { openStudentForm(t.dataset.id); return; }
  if (act === 'edit-surah') { openSurahForm(+t.dataset.s); return; }
  if (act === 'bulk-open') { openBulk(t.dataset.id, false); return; }
  if (act === 'sfilter') { ui.sFilter = t.dataset.f; render(); return; }
  if (act === 'set-full') { var f1 = t.closest('form'); f1.elements.a.value = COUNTS[+f1.dataset.s - 1]; return; }
  if (act === 'set-zero') { t.closest('form').elements.a.value = 0; return; }
  if (act === 'bulk-range') { var f2 = t.closest('form'); setBulkRange(f2, +f2.elements.from.value, +f2.elements.to.value); return; }
  if (act === 'preset') { setBulkRange(t.closest('form'), +t.dataset.a, +t.dataset.b); return; }
  if (act === 'del-student') {
    var s = findStudent(t.dataset.id); if (!s) return;
    confirmBox('حذف الطالب', 'سيُحذف «' + s.name + '» وجميع سجلات تسميعه، ولا يمكن التراجع.', 'حذف الطالب', function(){
      state.students = state.students.filter(function(x){ return x.id !== s.id; });
      state.sessions = state.sessions.filter(function(x){ return x.studentId !== s.id; });
      ui.view = 'students'; ui.studentId = null; commit(); closeModal(); render(); toast('تم حذف الطالب');
    });
    return;
  }
  if (act === 'del-session') {
    var id = t.dataset.id;
    confirmBox('حذف التسميع', 'سيُحذف هذا التسميع من السجل. لا يتغير مستوى الحفظ المسجّل للسور؛ عدّله من قائمة السور إن لزم.', 'حذف', function(){
      state.sessions = state.sessions.filter(function(x){ return x.id !== id; });
      commit(); closeModal(); render(); toast('تم حذف التسميع');
    });
    return;
  }
  if (act === 'confirm-yes') { var fn = confirmFn; if (fn) fn(); return; }
  if (act === 'end-surah') { var f = t.closest('form'); f.elements.a.value = COUNTS[+f.elements.s.value - 1]; updateRange(f); return; }
  if (act === 'report') { openReportForm(t.dataset.id); return; }
  if (act === 'to-teacher-login') { ui.mode = 'teacher-login'; ui.authErr = ''; render(); return; }
  if (act === 'to-parent-phone') { ui.mode = 'parent-phone'; ui.parentErr = ''; render(); return; }
  if (act === 'to-landing') { ui.mode = 'landing'; render(); return; }
  if (act === 'parent-select') { ui.parentViewId = t.dataset.id; ui.mode = 'parent-view'; render(); return; }
  if (act === 'change-pin') { openChangePin(); return; }
  if (act === 'logout') {
    if (db && authUser) { db.collection('authorized_sessions').doc(authUser.uid).delete().catch(function(){}); }
    myTeacher = null; myPhone = null; ui = freshUi(); ui.mode = 'landing'; render(); return;
  }
  if (act === 'admin-open') { openAdmin(); return; }
  if (act === 'teacher-edit') { openEditTeacher(t.dataset.phone); return; }
  if (act === 'teacher-remove') {
    var phone = t.dataset.phone;
    confirmBox('إزالة معلّم', 'سيُمنع صاحب هذا الرقم من الدخول فورًا. يبقى بإمكان إضافته مجددًا لاحقًا.', 'إزالة', function(){
      db.collection('teachers').doc(phone).delete()
        .then(function(){ return db.collection('teacher_pins').doc(phone).delete(); })
        .then(function(){ toast('تمت الإزالة'); closeModal(); openAdmin(); })
        .catch(function(){ toast('تعذّرت الإزالة'); });
    });
    return;
  }
  if (act === 'backup') { openBackup(); return; }
  if (act === 'dl-json') { saveFile('hifz-backup-' + today() + '.json', JSON.stringify(state)); return; }
  if (act === 'dl-csv') { saveFile('hifz-log-' + today() + '.csv', toCsv()); return; }
  if (act === 'dl-summary') { saveFile('hifz-summary-' + today() + '.csv', toSummaryCsv()); return; }
  if (act === 'copy-json') {
    var ta = $('#bk'); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (er) {}
    if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).then(function(){ toast('تم النسخ'); }, function(){ toast('حدّد النص وانسخه يدويًا'); }); return; }
    toast(ok ? 'تم النسخ' : 'حدّد النص وانسخه يدويًا'); return;
  }
  if (act === 'restore') { doRestore($('#bk').value); return; }
  if (act === 'wipe') {
    confirmBox('حذف كل البيانات', 'سيُحذف جميع الطلاب وسجلات التسميع من هذا الجهاز. نزّل نسخة احتياطية قبل ذلك إن أردت.', 'حذف كل شيء', function(){
      state = { students: [], sessions: [] }; ui = freshUi();
      commit(); closeModal(); render(); toast('تم حذف البيانات');
    });
    return;
  }
});
document.addEventListener('submit', function(e){
  var f = e.target; if (!f || !f.dataset) return;
  e.preventDefault();
  if (f.dataset.form === 'session') submitSession(f);
  else if (f.dataset.form === 'student') submitStudent(f);
  else if (f.dataset.form === 'surah') submitSurah(f);
  else if (f.dataset.form === 'bulk') submitBulk(f);
  else if (f.dataset.form === 'report') submitReport(f);
  else if (f.dataset.form === 'teacher-login') submitTeacherLogin(f);
  else if (f.dataset.form === 'parent-phone') submitParentPhone(f);
  else if (f.dataset.form === 'add-teacher') submitAddTeacher(f);
  else if (f.dataset.form === 'edit-teacher') submitEditTeacher(f);
  else if (f.dataset.form === 'change-pin') submitChangePin(f);
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'q') { ui.q = el.value; $('#studentList').innerHTML = studentListHtml(); return; }
  if (el.id === 'sq') { ui.sq = el.value; $('#surahList').innerHTML = surahListHtml(ui.studentId); return; }
  var f = el.form;
  if (f && f.dataset && f.dataset.form === 'session' && el.name === 'a') updateRange(f);
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'fHalaqa') { ui.halaqa = el.value; render(); return; }
  if (el.id === 'logStudent') { ui.logStudent = el.value; render(); return; }
  if (el.id === 'bkf' && el.files && el.files[0]) {
    var rd = new FileReader();
    rd.onload = function(){ $('#bk').value = String(rd.result || ''); doRestore($('#bk').value); };
    rd.readAsText(el.files[0]);
    return;
  }
  var f = el.form;
  if (!f || !f.dataset) return;
  if (f.dataset.form === 'bulk' && el.name === 'c') { updateBulk(f); return; }
  if (f.dataset.form !== 'session') return;
  if (el.name === 'student') { f.elements.s.value = suggestSurah(el.value); f.elements.a.value = ''; }
  if (el.name === 's') f.elements.a.value = '';
  f.elements.a.max = COUNTS[+f.elements.s.value - 1];
  updateRange(f);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && $('#modal').firstChild) closeModal(); });

/* ===== التشغيل ===== */
load();
render();
initCloud();
})();
</script>
</body>
</html>
